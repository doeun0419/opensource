<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>셔틀버스 대기 시스템</title>
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='bus.css') }}">
</head>
<body>

    <!-- (중간 HTML 내용은 그대로 유지) -->

    <!-- JS 연결 (body 태그 닫히기 직전에 넣어줘) -->
    <script src="{{ url_for('static', filename='bus.js') }}"></script>
    
    <!-- 실시간 인원수 업데이트 스크립트는 HTML에 남겨둬야 해! -->
    <script>
        function updateDashboard() {
            fetch('/data')
                .then(res => res.json())
                .then(data => {
                    const count = data.current_inside;
                    document.getElementById("count").innerText = count + "명";
                    let percent = Math.min((count / 50) * 100, 100);
                    document.getElementById("percent").innerText = percent.toFixed(1) + "%";
                    let bar = document.getElementById("bar-fill"); // CSS 클래스 확인 후 ID 맞추기
                    if(bar) bar.style.width = percent + "%";
                    
                    let statusText = "여유", color = "#4caf50";
                    if (percent >= 60) { statusText = "혼잡"; color = "#ff9800"; }
                    if (percent >= 90) { statusText = "위험"; color = "#f44336"; }
                    document.getElementById("status").innerText = statusText;
                    if(bar) bar.style.background = color;
                });
        }
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
